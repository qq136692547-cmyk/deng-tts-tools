   1. Speed -- invoke.js is a render-blocking third-party script. On slow

      pushing the article body out of the first paint.
   2. Safety -- running in the top-level document let this script navigate the
      whole page away to a third-party redirect destination. The host page now
      frames it with sandbox="allow-scripts allow-same-origin" and no
      allow-top-navigation, so the ad can render but can never navigate the
      host page or open a popup.

  Same ad code, same key, same size. Do not inline this back into the host pages.

<!-- Grow the host iframe to fit whatever the ad renders, so a taller-than-declared
     creative can never be clipped. Same-origin, so touching frameElement is allowed.
     Grow only, capped. -->
<script>
(function () {
  var MAX = 900, last = 0;
  function fit() {
    try {
      var h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      var el = window.frameElement;
      if (el && h > 60 && h <= MAX && h > last + 8) { last = h; el.style.height = h + 'px'; }
    } catch (e) { /* detached or cross-origin: keep the fixed height */ }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fit);
  else fit();
  window.addEventListener('load', fit);
  setInterval(fit, 1500);
})();
</script>
